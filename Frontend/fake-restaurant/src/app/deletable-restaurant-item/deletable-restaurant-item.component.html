<!DOCTYPE html>

<div class="flex flex-col bg-white border border-2 rounded-lg p-3 shadow-lg">
    <div class=" flex items-center gap-2 pb-1">
        @if (images != undefined) {
        <svg id="prevButton" (click)="prevImage()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 hover:rounded-lg shadow-lg transition duration-200 ease-in-out" [class.hover:bg-orange-400]="imageNumber > 0" [class.hover:text-white]="imageNumber > 0"
            [class.cursor-pointer]="imageNumber > 0" [class.hover:bg-gray-200]="imageNumber === 0" [class.text-gray-400]="imageNumber === 0" [class.cursor-not-allowed]="imageNumber === 0">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
            @if (images != undefined) {
                <img id="selectedImage" [src]="srcImg" alt="Foto" class="size-64 rounded-xl object-center" (click)="viewDetail()" />
        
            }@else{
                <img src="assets/default.svg" alt="" class="size-64 rounded-xl object-center" />
            }
            <svg (click)="nextImage()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 hover:rounded-lg transition duration-200 ease-in-out" [class.hover:bg-orange-400]="imageNumber < images.length - 1" [class.hover:text-white]="imageNumber < images.length - 1 "
            [class.hover:bg-gray-200]="imageNumber === images.length - 1" [class.text-gray-400]="imageNumber === images.length - 1" [class.cursor-not-allowed]="imageNumber === images.length - 1">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg> }


    </div>
    <hr>
    <div >
        <div class="flex flex-row justify-between items-center ">
            <div (click)="viewDetail()" class="flex flex-col">
                <h1 class="text-xl font-bold">{{restaurantItem.name}}</h1>
                <div class="flex flex-row items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349M3.75 21V9.349m0 0a3.001 3.001 0 0 0 3.75-.615A2.993 2.993 0 0 0 9.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 0 0 2.25 1.016c.896 0 1.7-.393 2.25-1.015a3.001 3.001 0 0 0 3.75.614m-16.5 0a3.004 3.004 0 0 1-.621-4.72l1.189-1.19A1.5 1.5 0 0 1 5.378 3h13.243a1.5 1.5 0 0 1 1.06.44l1.19 1.189a3 3 0 0 1-.621 4.72M6.75 18h3.75a.75.75 0 0 0 .75-.75V13.5a.75.75 0 0 0-.75-.75H6.75a.75.75 0 0 0-.75.75v3.75c0 .414.336.75.75.75Z" />
                    </svg>

                    <h3 class="text-lg">{{restaurantItem.type}}</h3>
                </div>

            </div>

            <div id="trash" class=" flex items-center justify-center border border-2 rounded-lg  p-2 hover:bg-orange-400 hover:text-white transition duration-200 ease-in-out" (click)="deleteRestaurant()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>

            </div>

        </div>
        

    </div>
</div>
