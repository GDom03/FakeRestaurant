<!DOCTYPE html>
<section>

    <div class="flex flex-col items-center justify-center p-2 gap-3">
        <div class="text-lg font-bold">
            <h1>Welcome {{user.email}}</h1>
        </div>

        <div class="flex flex-col gap-3 justify-center">
            <div class="flex flex-col gap-3 bg-gray-200 p-3 rounded-lg">


                <h1 class="font-bold text-center">Restaurant</h1>

                <a routerLink="/user-restaurants">
                    <div class="flex flex-row text-md items-center gap-2 p-2 rounded-lg shadow-lg bg-white hover:text-white hover:bg-orange-400 transition duration-200 ease-in-out">
                        <div>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349M3.75 21V9.349m0 0a3.001 3.001 0 0 0 3.75-.615A2.993 2.993 0 0 0 9.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 0 0 2.25 1.016c.896 0 1.7-.393 2.25-1.015a3.001 3.001 0 0 0 3.75.614m-16.5 0a3.004 3.004 0 0 1-.621-4.72l1.189-1.19A1.5 1.5 0 0 1 5.378 3h13.243a1.5 1.5 0 0 1 1.06.44l1.19 1.189a3 3 0 0 1-.621 4.72M6.75 18h3.75a.75.75 0 0 0 .75-.75V13.5a.75.75 0 0 0-.75-.75H6.75a.75.75 0 0 0-.75.75v3.75c0 .414.336.75.75.75Z" />
                            </svg>


                        </div>
                        <div>
                            <h1>Your Restaurants</h1>
                        </div>

                    </div>


                </a>

                <a id="addRestaurantLink" routerLink="/add-restaurant">
                    <div class="flex flex-row text-md items-center gap-2 p-2 rounded-lg shadow-lg bg-white hover:text-white hover:bg-orange-400 transition duration-200 ease-in-out">
                        <div>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>




                        </div>
                        <div>
                            <h1>Add Restaurant</h1>
                        </div>

                    </div>


                </a>
            </div>

            <div class="flex flex-col gap-3 bg-gray-200 p-3 rounded-lg">

                <h1 class="font-bold text-center">Review</h1>

                <a routerLink="/user-reviews">
                    <div class="flex flex-row text-md items-center gap-2 p-2 rounded-lg shadow-lg bg-white hover:text-white hover:bg-orange-400 transition duration-200 ease-in-out">
                        <div>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
                            </svg>



                        </div>
                        <div>
                            <h1>Your Reviews</h1>
                        </div>

                    </div>

                </a>

            </div>


            <div class="flex flex-col gap-3 bg-gray-200 p-3 rounded-lg">

                <h1 class="font-bold text-center">Account</h1>

                <div (click)="logout()" class="flex flex-row items-center gap-2 rounded-lg p-2.5 shadow-lg bg-red-500 text-white hover:bg-red-600 transition duration-200 ease-in-out">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" />
                    </svg>

                    <h1>Logout</h1>
                </div>
                <div id="deleteAccountButton" (click)="deleteAccount()" class="flex flex-row items-center gap-2 rounded-lg p-2.5 shadow-lg bg-red-500 text-white hover:bg-red-600 transition duration-200 ease-in-out">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>


                    <h1>Delete Account</h1>
                </div>
            </div>

        </div>
        
        


    </div>
    




</section>
